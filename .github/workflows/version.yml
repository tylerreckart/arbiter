name: Version bump

# main is ruleset-protected ("Changes must be made through a pull
# request"), so this workflow never pushes commits to main.
#
# It does not run on the push itself.  CI (`ci.yml`, workflow name
# "CI") has to finish green on that push to main first.  A red main
# cannot open a release PR or cut a tag.  workflow_run's github.sha
# is the default-branch SHA at event time, so the job re-fetches
# origin/main and requires a successful ci.yml run on that exact
# commit before it bumps or tags.  Pull-request CI does not match
# (event is pull_request, head branch is not main).
#
# Feature merge (or workflow_dispatch, which also requires CI on
# origin/main):
#   Open / update a `chore/release-vX.Y.Z` PR with the CMakeLists,
#   changelog, and docs install-pin edits.  Enable auto-merge when the
#   repo allows it.  Do not tag yet — a squash merge rewrites the SHA.
#
# Release PR merged (`chore(release): vX.Y.Z` on main), or a feature
# PR that already bumped CMakeLists ahead of the latest tag:
#   Tag HEAD and dispatch release.yml.  Tag pushes are not subject to
#   the pull-request ruleset.  release.yml checks CI again on the
#   tagged commit.
#
# Auto cuts a patch (0.13.14 → 0.13.15).
#
# 1.0.0 is a normal pull request that sets
# `project(arbiter VERSION 1.0.0)`. Do not use Actions → Version bump
# → major for that. After the PR merges and CI is green on that main
# SHA, this workflow tags v1.0.0 (cmake is already ahead of the latest
# tag, so it does not open another release PR).
#
# Bot release PRs (`chore(release): vX.Y.Z`) are pushed and squash-merged
# with GITHUB_TOKEN. Those events do not start CI. This job dispatches
# ci.yml on the release branch, waits, squash-merges, dispatches ci.yml
# on the squash SHA, waits, then tags. Tagging checks the tag again
# immediately before `git tag` so a second run does not create it twice.
#
# Other cuts:
#   - Actions → Version bump → minor / explicit X.Y.Z (not the 1.0 path)
#   - `[skip version]` skips entirely (push-driven runs only)
#   - `git tag vX.Y.Z && git push origin vX.Y.Z` still fires
#     release.yml on its own; that workflow refuses a commit CI
#     never passed
#
# Creating the release PR requires Settings → Actions → General →
# "Allow GitHub Actions to create and approve pull requests".
#
# Branch protection is separate and cannot be set from this file.
# Mark the CI job names as required status checks so a red PR cannot
# merge: version-bump-script, macos-arm64, linux-x86_64,
# linux-x86_64-asan, linux-x86_64-tsan.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump type when no explicit version is set"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: "Explicit X.Y.Z (optional; overrides bump type)"
        required: false
        type: string

permissions:
  contents: write        # push release branch + tags
  pull-requests: write   # open / auto-merge the release PR
  actions: write         # list CI runs (read) and dispatch release.yml

concurrency:
  group: version-main
  cancel-in-progress: false

jobs:
  bump:
    name: Cut version
    runs-on: ubuntu-22.04
    # Two full CI waits (release branch, then the squash SHA on main).
    # TSan's own job budget is 60 minutes, and the waits are serial.
    timeout-minutes: 150
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    outputs:
      skipped: ${{ steps.cut.outputs.skipped }}
      version: ${{ steps.cut.outputs.version }}
      tagged: ${{ steps.cut.outputs.tagged }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to origin/main
        run: |
          set -euxo pipefail
          git fetch origin main --tags --force
          git checkout -B main origin/main

      # workflow_dispatch ignores the commit message so a human can cut
      # a release from a commit that was itself marked [skip version].
      - name: Honor [skip version]
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ] &&
             git log -1 --format=%B | grep -F '[skip version]' >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "origin/main says [skip version]; not bumping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require CI success on this commit
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euxo pipefail
          chmod +x .github/scripts/require_ci_success.sh
          .github/scripts/require_ci_success.sh "$(git rev-parse HEAD)"

      - name: Self-test bump script
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euxo pipefail
          chmod +x .github/scripts/bump_version.sh \
                   .github/scripts/test_bump_version.sh
          .github/scripts/test_bump_version.sh

      - name: Cut version
        id: cut
        if: steps.gate.outputs.skip != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "tagged=false" >> "$GITHUB_OUTPUT"
          # The commit we will tag or branch from, not the workflow_run
          # event SHA (github.sha on workflow_run is not that commit).
          TRIGGER_SHA="$(git rev-parse HEAD)"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE=manual
          else
            MODE=auto
          fi

          args=(--mode "$MODE" --bump "${INPUT_BUMP:-patch}" --trigger-sha "$TRIGGER_SHA" --no-tag)
          if [ -n "${INPUT_VERSION:-}" ]; then
            args+=(--version "$INPUT_VERSION")
          fi
          .github/scripts/bump_version.sh "${args[@]}"

          skipped="$(grep '^skipped=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)"
          VERSION="$(grep '^version=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2- || true)"
          if [ "$skipped" = "true" ]; then
            exit 0
          fi
          if [ -z "$VERSION" ]; then
            echo "bump produced no version" >&2
            exit 1
          fi

          MAIN_SHA="$(git rev-parse origin/main)"
          HEAD_SHA="$(git rev-parse HEAD)"

          # Create the tag only when it is absent. A dispatched CI run can
          # finish while another copy of this job is still between the
          # check and `git tag`; fetch again immediately before tagging.
          tag_version() {
            local version="$1" sha="$2" have
            git fetch origin "refs/tags/v${version}" --force || true
            if git rev-parse -q --verify "refs/tags/v${version}^{commit}" >/dev/null; then
              have="$(git rev-parse "refs/tags/v${version}^{commit}")"
              if [ "$have" = "$sha" ]; then
                echo "v${version} already tags ${sha}"
                echo "tagged=true" >> "$GITHUB_OUTPUT"
                return 0
              fi
              echo "v${version} already tags ${have}, not ${sha}" >&2
              exit 1
            fi
            git tag "v${version}" "$sha"
            git push origin "refs/tags/v${version}"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "bump_version: tagged v${version} on ${sha}"
          }

          # workflow_dispatch CI for a SHA that a GITHUB_TOKEN push will
          # not start on its own. Watches the newest run for that SHA.
          wait_for_dispatched_ci() {
            local sha="$1" id="" attempt
            for attempt in $(seq 1 36); do
              id="$(gh run list \
                --repo "$GH_REPO" \
                --workflow ci.yml \
                --commit "$sha" \
                --event workflow_dispatch \
                --limit 10 \
                --json databaseId,status,conclusion,headSha,createdAt \
                --jq "[.[] | select(.headSha==\"${sha}\")] | sort_by(.createdAt) | reverse | .[0].databaseId // empty")"
              if [ -n "$id" ]; then
                break
              fi
              sleep 5
            done
            if [ -z "$id" ]; then
              echo "No ci.yml workflow_dispatch run appeared for ${sha}" >&2
              exit 1
            fi
            echo "Watching CI run ${id} for ${sha}"
            gh run watch "$id" --repo "$GH_REPO" --exit-status
          }

          # Version files already on main (release PR just merged, or a
          # prepare-release PR bumped CMakeLists, including 1.0.0).
          # Tag that commit — allowed even when main forbids direct pushes.
          if [ "$HEAD_SHA" = "$MAIN_SHA" ]; then
            tag_version "$VERSION" "$HEAD_SHA"
            exit 0
          fi

          # New release commit is not on main. Open a PR, run CI on it,
          # squash-merge, run CI on the squash SHA, then tag that SHA.
          # GITHUB_TOKEN pushes do not start those runs by themselves.
          BRANCH="chore/release-v${VERSION}"
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          PR_URL="$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url // empty' || true)"
          if [ -z "$PR_URL" ]; then
            if ! PR_URL="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(release): v${VERSION}" \
              --body "Cut CMakeLists, changelog, and the docs install pin to v${VERSION}. Squash-merge and keep this title; the version workflow then tags v${VERSION} and publishes binaries. main requires pull requests, so the bot cannot push this commit directly.")"; then
              echo "::error::Could not open the release PR. Enable Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests', then re-run. Branch ${BRANCH} is already pushed."
              exit 1
            fi
          fi
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "opened ${PR_URL}"

          # The push of BRANCH used GITHUB_TOKEN, so pull_request and
          # push events did not start CI. Dispatch it, then merge.
          echo "Dispatching CI on ${BRANCH} @ ${HEAD_SHA}"
          gh workflow run ci.yml --repo "$GH_REPO" --ref "$BRANCH"
          wait_for_dispatched_ci "$HEAD_SHA"

          if ! gh pr merge "$PR_URL" --squash --delete-branch; then
            echo "Could not squash-merge ${PR_URL}."
            echo "Merge it by hand and keep the chore(release) title."
            echo "A human merge starts CI; this workflow tags after that run is green."
            exit 0
          fi

          git fetch origin main --tags --force
          SQUASH="$(git rev-parse origin/main)"
          tip_subject="$(git log -1 --format=%s origin/main)"
          case "$tip_subject" in
            "chore(release): v${VERSION}"*) ;;
            *)
              echo "origin/main is ${SQUASH} (${tip_subject}), not the v${VERSION} squash. Not tagging." >&2
              exit 1
              ;;
          esac

          # The squash push also used GITHUB_TOKEN. Dispatch CI on that
          # exact main SHA, then tag it.
          echo "Dispatching CI on main @ ${SQUASH}"
          gh workflow run ci.yml --repo "$GH_REPO" --ref main
          wait_for_dispatched_ci "$SQUASH"
          .github/scripts/require_ci_success.sh "$SQUASH"
          tag_version "$VERSION" "$SQUASH"

      - name: Dispatch binary release
        if: steps.cut.outputs.tagged == 'true' && steps.cut.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f "tag=v${{ steps.cut.outputs.version }}"
