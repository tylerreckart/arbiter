# Drop into /etc/nginx/sites-available/arbiter and symlink into sites-enabled.
# Obtain certs first, e.g.:
#   sudo certbot --nginx -d arbiter.example.com
# Or start with the HTTP-only server block and let Certbot rewrite it.

upstream arbiter_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name arbiter.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arbiter.example.com;

    # Managed by Certbot in a typical install; placeholders shown here.
    ssl_certificate     /etc/letsencrypt/live/arbiter.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arbiter.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Metrics are unauthenticated — block at the edge.
    location = /v1/metrics {
        return 403;
    }

    location /v1/ {
        proxy_pass         http://arbiter_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   Connection        "";

        # Critical for SSE (orchestrate, messages, notifications, reconnect).
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header         X-Accel-Buffering no always;
    }

    location / {
        return 404;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
